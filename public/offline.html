<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#4f46e5">
    <title>Offline · WMVAA Akademia</title>
    <link rel="manifest" href="manifest.webmanifest">
    <style>
        :root{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f4f7fb}
        *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 80% 5%,rgba(99,102,241,.15),transparent 32%),#f4f7fb}
        main{width:min(100%,420px);padding:34px 24px;border:1px solid #e3e8f0;border-radius:30px;background:rgba(255,255,255,.94);box-shadow:0 24px 70px rgba(30,41,59,.12);text-align:center}
        img{width:72px;height:72px;margin-bottom:20px}h1{font-size:1.55rem;letter-spacing:-.04em;margin:0 0 10px}p{color:#68758a;line-height:1.65;margin:0 0 24px}.status{display:inline-flex;align-items:center;gap:8px;margin-bottom:18px;padding:7px 11px;border-radius:999px;background:#fff7ed;color:#c2410c;font-size:.75rem;font-weight:750}.status:before{content:"";width:8px;height:8px;border-radius:50%;background:#f97316}
        button,a{min-height:50px;width:100%;display:flex;align-items:center;justify-content:center;border:0;border-radius:16px;background:linear-gradient(135deg,#5b5ce2,#4338ca);color:#fff;font:750 .88rem inherit;text-decoration:none;cursor:pointer}small{display:block;margin-top:18px;color:#94a3b8;line-height:1.5}
    </style>
</head>
<body>
<main>
    <div class="status">Tidak ada koneksi</div>
    <img src="assets/img/brand-mark.svg" alt="WMVAA Akademia">
    <h1>Anda sedang offline</h1>
    <p>App shell tetap tersedia. Sambungkan perangkat ke internet untuk memuat data akademik terbaru dan menjaga kerahasiaan data sekolah.</p>
    <button type="button" onclick="location.reload()">Coba hubungkan kembali</button>
    <small>Halaman pribadi guru dan siswa tidak disimpan permanen pada perangkat bersama.</small>
</main>
<script>addEventListener('online',()=>location.reload());</script>
</body>
</html>
